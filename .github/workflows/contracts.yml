name: Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:contracts
      - run: npm run check:static
      - run: npm run check:publication
      # Native setup is macOS arm64 only. This lane does not certify the
      # GDExtension, graphical rendering or other platform support.
  native-cold-start:
    runs-on: macos-15
    # Cold dependency builds and native/headed suites took about 46 minutes.
    # Keep a bounded global budget without changing individual probe deadlines.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install pinned official Godot
        run: |
          test "$(uname -m)" = arm64
          mkdir -p .deps/godot
          GODOT_DOWNLOAD_URL=$(node -p "require('./dependencies.json').godot.macos.url")
          GODOT_DOWNLOAD_SHA=$(node -p "require('./dependencies.json').godot.macos.sha256")
          curl --fail --location --retry 2 --max-time 180 "$GODOT_DOWNLOAD_URL" -o .deps/godot.zip
          echo "$GODOT_DOWNLOAD_SHA  .deps/godot.zip" | shasum -a 256 -c -
          ditto -x -k .deps/godot.zip .deps/godot
          echo "GODOT_BIN=$GITHUB_WORKSPACE/.deps/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
      - run: npm run setup
      - name: Reconstruct affine matrices, collapse singular ones and reject unsupported transforms
        run: .deps/build/affine_transform_test
      - run: npm run test:codegen:native -- --node "$(command -v node)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: codegen-native-compile
          path: |
            build/codegen-native-compile/report.json
            build/codegen-native-compile/generated/manifest.json
            build/codegen-native-compile/generated/schema.json
            build/codegen-native-compile/logs/*.log
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
      - run: npm run sdk:native:pack -- --build-dir .deps/build --out build/native-sdk
      - run: npm run sdk:native:verify -- --sdk build/native-sdk
      - run: npm run test:adapters:native -- --sdk build/native-sdk --out build/adapter-registry
      - run: npm run test:adapters:loader -- --sdk build/native-sdk --out build/adapter-loader
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: adapter-registry-sdk
          path: |
            .deps/build/native-sdk-build.json
            build/native-sdk/manifest.json
            build/native-sdk/receipt.json
            build/native-sdk/native-combination.json
            build/adapter-registry/report.json
            build/adapter-registry/generated/manifest.json
            build/adapter-registry/logs/*.log
            build/adapter-loader/report.json
            build/adapter-loader/logs/*.log
